<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Night Local — Videos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&amp;family=IBM+Plex+Sans+Condensed:wght@400;600;700&amp;display=swap">
<style>
body{margin:0;background:#0b1215}
a{color:#ffb547}a:hover{color:#2fd3cf}
</style>
</helmet>
<div style="background: #0b1215; color: #eef3f3; font-family: 'IBM Plex Sans Condensed', sans-serif; min-height: 100vh">

<div style="background: #ffb547; color: #111; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding: 10px 24px; font-weight: 700; font-size: 14px; letter-spacing: 1px">
<span>▶ NOW SHOWING: [LATEST SET TITLE]</span><span>PLATFORM ROM</span>
</div>

<header style="max-width: 1240px; margin: 0 auto; padding: 20px 24px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between">
<a href="Local-Profile.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #eef3f3"><span style="width: 40px; height: 40px; border-radius: 50%; background: #2fd3cf; color: #062322; display: flex; align-items: center; justify-content: center; font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 18px">R</span><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 26px; letter-spacing: 1px">ROWDIES LINE</span></a>
<nav style="display: flex; flex-wrap: wrap; gap: 8px; font-weight: 700; font-size: 15px">
<a href="Local-Profile.dc.html" style="color: #eef3f3; text-decoration: none; padding: 10px 18px; border-radius: 999px; border: 1px solid #2a3b40">Profile</a>
<a href="Local-Videos.dc.html" style="background: #2fd3cf; color: #062322; text-decoration: none; padding: 10px 18px; border-radius: 999px">Videos</a>
<a href="Local-Profile.dc.html#gigs" style="color: #eef3f3; text-decoration: none; padding: 10px 18px; border-radius: 999px; border: 1px solid #2a3b40">Gigs</a>
<a href="Local-Profile.dc.html#book" style="color: #eef3f3; text-decoration: none; padding: 10px 18px; border-radius: 999px; border: 1px solid #2a3b40">Book</a>
</nav>
</header>

<section style="max-width: 1240px; margin: 0 auto; padding: 8px 24px 40px">
<h1 style="margin: 0 0 20px; font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 96px; line-height: 0.9; text-transform: uppercase">Window <span style="color: #ff7a1a">seat</span></h1>
<div style="background: #1e2c31; border-radius: 40px; padding: 18px">
<div style="position: relative; border-radius: 26px; overflow: hidden">
<img src="../assets/images/laser.jpg" alt="Latest set" style="display: block; width: 100%; height: 520px; object-fit: cover">
<div style="position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 16px; padding: 28px; background: linear-gradient(0deg, rgba(11,18,21,0.9), rgba(11,18,21,0) 50%)">
<div><div style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 44px; text-transform: uppercase">[SET TITLE]</div><div style="color: #b6c6c8">[VENUE] · [DATE] · [LENGTH]</div></div>
<button aria-label="Play latest set" style="width: 84px; height: 84px; border-radius: 50%; border: 0; background: #ff7a1a; color: #1b0b00; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg></button>
</div>
</div>
</div>
</section>

<section style="max-width: 1240px; margin: 0 auto; padding: 8px 24px 72px">
<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; font-weight: 700">
<button style="background: #ffb547; color: #111; border: 0; padding: 10px 18px; border-radius: 999px; font-family: inherit; font-weight: 700; font-size: 15px">All lines</button>
<button style="background: transparent; color: #eef3f3; border: 1px solid #2a3b40; padding: 10px 18px; border-radius: 999px; font-family: inherit; font-weight: 700; font-size: 15px">Live sets</button>
<button style="background: transparent; color: #eef3f3; border: 1px solid #2a3b40; padding: 10px 18px; border-radius: 999px; font-family: inherit; font-weight: 700; font-size: 15px">Reels</button>
<button style="background: transparent; color: #eef3f3; border: 1px solid #2a3b40; padding: 10px 18px; border-radius: 999px; font-family: inherit; font-weight: 700; font-size: 15px">Behind the scenes</button>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 18px">
<sc-for list="{{videos}}" as="v" hint-placeholder-count="8">
<a href="#" style="display: block; text-decoration: none; color: #eef3f3; background: #121c20; border-radius: 18px; overflow: hidden">
<img src="{{v.img}}" alt="{{v.title}}" style="display: block; width: 100%; height: 300px; object-fit: cover">
<div style="padding: 14px 16px; display: flex; align-items: center; gap: 12px"><span style="background: {{v.c}}; color: #0b1215; font-weight: 700; font-size: 13px; padding: 4px 10px; border-radius: 6px">{{v.tag}}</span><span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 22px; text-transform: uppercase">{{v.title}}</span></div>
</a>
</sc-for>
</div>
<div style="margin-top: 24px"><a href="https://www.youtube.com/@rowdiesofMumbai" style="font-weight: 700; font-size: 16px">More on our YouTube line →</a></div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1800}}'>
class Component extends DCLogic {
  renderVals() {
    const items = [
      ['../assets/images/drop.jpg', 'Drop Incoming', 'REEL'],
      ['../assets/images/energy.jpg', 'Energy', 'REEL'],
      ['../assets/images/deck.jpg', '[Video title]', 'LIVE'],
      ['../assets/images/neon.jpg', '[Video title]', 'LIVE'],
      ['../assets/images/crowd.jpg', '[Video title]', 'BTS'],
      ['../assets/images/plaid.jpg', '[Video title]', 'LIVE'],
      ['../assets/images/blue.jpg', '[Video title]', 'REEL'],
      ['../assets/images/laser.jpg', '[Video title]', 'LIVE']
    ];
    const col = { REEL: '#ffb547', LIVE: '#2fd3cf', BTS: '#ff7a1a' };
    return { videos: items.map((x) => ({ img: x[0], title: x[1], tag: x[2], c: col[x[2]] })) };
  }
}
</script>
</body>
</html>
