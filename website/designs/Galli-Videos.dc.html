<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Galli Wall — Videos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0;background:#1b1c1d}
a{color:#2ee6d6}a:hover{color:#ff8a2a}
</style>
</helmet>
<div style="background-color: #1b1c1d; background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 7px), repeating-linear-gradient(0deg, rgba(0,0,0,0.25) 0 1px, transparent 1px 5px); color: #ecebe6; font-family: 'Space Mono', monospace; min-height: 100vh; overflow: hidden">

<header style="max-width: 1240px; margin: 0 auto; padding: 24px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between">
<a href="Galli-Profile.dc.html" style="text-decoration: none; background: #ecebe6; color: #141414; font-family: 'Black Ops One', sans-serif; font-size: 22px; padding: 8px 14px; transform: rotate(-2deg); display: inline-block">ROWDIES OF MUMBAI</a>
<nav style="display: flex; flex-wrap: wrap; gap: 10px; font-weight: 700; font-size: 14px">
<a href="Galli-Profile.dc.html" style="color: #ecebe6; text-decoration: none; padding: 10px 16px; border: 2px dashed #5a5b5c">/PROFILE</a>
<a href="Galli-Videos.dc.html" style="color: #141414; background: #ff8a2a; text-decoration: none; padding: 10px 16px">/VIDEOS</a>
<a href="Galli-Profile.dc.html#gigs" style="color: #ecebe6; text-decoration: none; padding: 10px 16px; border: 2px dashed #5a5b5c">/GIGS</a>
<a href="Galli-Profile.dc.html#book" style="color: #ecebe6; text-decoration: none; padding: 10px 16px; border: 2px dashed #5a5b5c">/BOOK</a>
</nav>
</header>

<section style="max-width: 1240px; margin: 0 auto; padding: 32px 24px 56px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 20px; margin-bottom: 36px">
<h1 style="margin: 0; font-family: 'Black Ops One', sans-serif; font-weight: 400; font-size: 104px; line-height: 0.9; text-shadow: 6px 6px 0 #0d0d0d">PASTED</h1>
<span style="font-family: 'Black Ops One', sans-serif; font-size: 44px; color: #2ee6d6; transform: rotate(-4deg); display: inline-block">on the wall</span>
</div>
<div style="position: relative; background: #ecebe6; padding: 16px; transform: rotate(-1deg); box-shadow: 16px 18px 0 rgba(0,0,0,0.5)">
<div style="position: absolute; top: -14px; left: 12%; width: 140px; height: 34px; background: rgba(255,181,71,0.75); transform: rotate(-6deg); z-index: 2"></div>
<div style="position: absolute; top: -14px; right: 10%; width: 140px; height: 34px; background: rgba(255,181,71,0.75); transform: rotate(5deg); z-index: 2"></div>
<div style="position: relative">
<img src="../assets/images/laser.jpg" alt="Latest set" style="display: block; width: 100%; height: 540px; object-fit: cover; filter: contrast(1.15)">
<button aria-label="Play latest set" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%) rotate(-8deg); background: #ff8a2a; color: #141414; border: 4px solid #141414; font-family: 'Black Ops One', sans-serif; font-size: 34px; padding: 18px 32px; cursor: pointer">▶ PLAY</button>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; color: #141414; padding-top: 14px"><span style="font-family: 'Black Ops One', sans-serif; font-size: 30px">[LATEST SET TITLE]</span><span style="font-weight: 700">[VENUE] · [DATE]</span></div>
</div>
</section>

<section style="max-width: 1240px; margin: 0 auto; padding: 24px 24px 80px">
<div style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 36px; font-weight: 700; font-size: 14px">
<button style="background: #2ee6d6; color: #141414; border: 0; padding: 12px 18px; font-family: inherit; font-weight: 700">#ALL</button>
<button style="background: transparent; color: #ecebe6; border: 2px dashed #5a5b5c; padding: 10px 18px; font-family: inherit; font-weight: 700">#LIVE</button>
<button style="background: transparent; color: #ecebe6; border: 2px dashed #5a5b5c; padding: 10px 18px; font-family: inherit; font-weight: 700">#REELS</button>
<button style="background: transparent; color: #ecebe6; border: 2px dashed #5a5b5c; padding: 10px 18px; font-family: inherit; font-weight: 700">#BTS</button>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 40px 32px">
<sc-for list="{{videos}}" as="v" hint-placeholder-count="8">
<a href="#" style="display: block; text-decoration: none; background: #ecebe6; color: #141414; padding: 10px 10px 14px; transform: {{v.rot}}; box-shadow: 10px 12px 0 rgba(0,0,0,0.45)">
<img src="{{v.img}}" alt="{{v.title}}" style="display: block; width: 100%; height: 300px; object-fit: cover; filter: contrast(1.1)">
<div style="display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; align-items: baseline"><span style="font-family: 'Black Ops One', sans-serif; font-size: 20px">{{v.title}}</span><span style="font-size: 12px; font-weight: 700; color: #b34d00">{{v.tag}}</span></div>
</a>
</sc-for>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1800}}'>
class Component extends DCLogic {
  renderVals() {
    const rots = ['rotate(-2deg)', 'rotate(1.5deg)', 'rotate(-0.5deg)', 'rotate(2deg)'];
    const items = [
      ['../assets/images/drop.jpg', 'Drop Incoming', '#REEL'],
      ['../assets/images/energy.jpg', 'Energy', '#REEL'],
      ['../assets/images/deck.jpg', '[Video title]', '#LIVE'],
      ['../assets/images/neon.jpg', '[Video title]', '#LIVE'],
      ['../assets/images/crowd.jpg', '[Video title]', '#BTS'],
      ['../assets/images/plaid.jpg', '[Video title]', '#LIVE'],
      ['../assets/images/blue.jpg', '[Video title]', '#REEL'],
      ['../assets/images/laser.jpg', '[Video title]', '#REEL']
    ];
    return { videos: items.map((x, i) => ({ img: x[0], title: x[1], tag: x[2], rot: rots[i % 4] })) };
  }
}
</script>
</body>
</html>
