<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deck HUD — Videos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&amp;family=JetBrains+Mono:wght@400;600;800&amp;display=swap">
<style>
body{margin:0;background:#080c0e}
a{color:#21d4d8}a:hover{color:#ff8a24}
</style>
</helmet>
<div style="background: #080c0e; color: #d9e6e8; font-family: 'JetBrains Mono', monospace; min-height: 100vh">

<header style="border-bottom: 1px solid #1c2e33; background: #0c1316">
<div style="max-width: 1240px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between">
<a href="Deck-Profile.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #d9e6e8"><span style="width: 12px; height: 12px; border-radius: 50%; background: #ff8a24; box-shadow: 0 0 10px #ff8a24"></span><span style="font-family: Michroma, sans-serif; font-size: 16px; letter-spacing: 3px">ROWDIES_OF_MUMBAI</span></a>
<nav style="display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; font-weight: 600">
<a href="Deck-Profile.dc.html" style="color: #9fb4b8; text-decoration: none; padding: 9px 14px; border: 1px solid #23393f">01 PROFILE</a>
<a href="Deck-Videos.dc.html" style="color: #04181a; background: #21d4d8; text-decoration: none; padding: 9px 14px">02 VIDEOS</a>
<a href="Deck-Profile.dc.html#gigs" style="color: #9fb4b8; text-decoration: none; padding: 9px 14px; border: 1px solid #23393f">03 GIGS</a>
<a href="Deck-Profile.dc.html#book" style="color: #9fb4b8; text-decoration: none; padding: 9px 14px; border: 1px solid #23393f">04 BOOK</a>
</nav>
</div>
</header>

<section style="max-width: 1240px; margin: 0 auto; padding: 28px 24px 0">
<div style="background: #0c1316; border: 1px solid #1c2e33">
<div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding: 12px 18px; font-size: 12px; letter-spacing: 2px; border-bottom: 1px solid #1c2e33"><span style="color: #21d4d8">● PLAYING · DECK A</span><span style="color: #6f878c">[LENGTH] · [BPM] BPM</span></div>
<div style="position: relative">
<img src="../assets/images/laser.jpg" alt="Latest set" style="display: block; width: 100%; height: 520px; object-fit: cover">
<div style="position: absolute; left: 18px; bottom: 18px; background: rgba(8,12,14,0.85); padding: 14px 18px; border-left: 3px solid #ff8a24"><div style="font-family: Michroma, sans-serif; font-size: 26px">[SET TITLE]</div><div style="color: #9fb4b8; font-size: 13px">[VENUE] · [DATE]</div></div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 16px 18px">
<button aria-label="Cue" style="width: 56px; height: 56px; border-radius: 50%; border: 2px solid #ff8a24; background: transparent; color: #ff8a24; font-family: inherit; font-weight: 800; cursor: pointer">CUE</button>
<button aria-label="Play" style="width: 56px; height: 56px; border-radius: 50%; border: 0; background: #21d4d8; color: #04181a; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg></button>
<div style="flex: 1 1 300px; display: flex; align-items: center; gap: 2px; height: 44px">
<sc-for list="{{wave}}" as="w" hint-placeholder-count="90"><div style="flex: 1 1 0; height: {{w.h}}; background: {{w.c}}"></div></sc-for>
</div>
<span style="font-size: 13px; color: #9fb4b8">[00:00] / [LENGTH]</span>
</div>
</div>
</section>

<section style="max-width: 1240px; margin: 0 auto; padding: 20px 24px 64px">
<div style="display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; font-size: 12px; font-weight: 600">
<button style="background: #21d4d8; color: #04181a; border: 0; padding: 9px 14px; font-family: inherit; font-weight: 700">ALL</button>
<button style="background: transparent; color: #9fb4b8; border: 1px solid #23393f; padding: 9px 14px; font-family: inherit; font-weight: 700">LIVE SETS</button>
<button style="background: transparent; color: #9fb4b8; border: 1px solid #23393f; padding: 9px 14px; font-family: inherit; font-weight: 700">REELS</button>
<button style="background: transparent; color: #9fb4b8; border: 1px solid #23393f; padding: 9px 14px; font-family: inherit; font-weight: 700">STUDIO</button>
</div>
<div style="background: #0c1316; border: 1px solid #1c2e33">
<div style="display: flex; gap: 16px; padding: 12px 18px; font-size: 12px; color: #6f878c; letter-spacing: 2px; border-bottom: 1px solid #1c2e33"><span style="width: 32px">#</span><span style="width: 96px">PREVIEW</span><span style="flex: 1">TITLE</span><span style="width: 80px">TYPE</span><span style="width: 90px">ACTION</span></div>
<sc-for list="{{videos}}" as="v" hint-placeholder-count="8">
<div style="display: flex; gap: 16px; align-items: center; padding: 10px 18px; border-bottom: 1px solid #16252a">
<span style="width: 32px; color: #21d4d8">{{v.n}}</span>
<img src="{{v.img}}" alt="{{v.title}}" style="width: 96px; height: 64px; object-fit: cover">
<span style="flex: 1; min-width: 0; font-weight: 600">{{v.title}}</span>
<span style="width: 80px; font-size: 12px; color: #ff8a24">{{v.tag}}</span>
<a href="#" style="width: 90px; color: #21d4d8; font-weight: 800; text-decoration: none; font-size: 13px">LOAD ›</a>
</div>
</sc-for>
</div>
<div style="margin-top: 16px; text-align: right"><a href="https://www.youtube.com/@rowdiesofMumbai" style="font-weight: 800; text-decoration: none; font-size: 13px">FULL LIBRARY ON YOUTUBE ›</a></div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1800}}'>
class Component extends DCLogic {
  renderVals() {
    const wave = [];
    for (let i = 0; i < 90; i++) {
      const v = Math.abs(Math.sin(i * 0.41) * 0.55 + Math.sin(i * 0.13) * 0.45);
      wave.push({ h: Math.round(15 + v * 85) + '%', c: i < 30 ? '#ff8a24' : '#2a4247' });
    }
    const items = [
      ['../assets/images/drop.jpg', 'Drop Incoming', 'REEL'],
      ['../assets/images/energy.jpg', 'Energy', 'REEL'],
      ['../assets/images/deck.jpg', '[Video title]', 'LIVE'],
      ['../assets/images/neon.jpg', '[Video title]', 'LIVE'],
      ['../assets/images/crowd.jpg', '[Video title]', 'BTS'],
      ['../assets/images/plaid.jpg', '[Video title]', 'STUDIO'],
      ['../assets/images/blue.jpg', '[Video title]', 'REEL'],
      ['../assets/images/laser.jpg', '[Video title]', 'LIVE']
    ];
    return { wave, videos: items.map((x, i) => ({ img: x[0], title: x[1], tag: x[2], n: String(i + 1).padStart(2, '0') })) };
  }
}
</script>
</body>
</html>
